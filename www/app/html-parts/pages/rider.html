<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Книга [Читалка]</title>
    <link rel="stylesheet" href="css/reider.min.css">
    <script src="/libs/vue.js"></script>
    <script src="/js/rider.js" defer></script>
</head>
<body id="app">

<!-- Модальное окно оповещений -->
<div class="css-modal-target" id="modal-notification">
    <div class="cmt" id="windowBody">
        <a href="#close" class="css-modal-close" id="close-modal-notification" title="Закрыть">&times;</a>
        <div class="heading-notification">
            ОПОВЕЩЕНИЕ
        </div>
        <div id="textNotification">Произведение <b>{{nameBook}}</b> добавленно в вашу библиотеку.</div>
    </div>
</div>
<!--<a href="#modal-notification" id="openModalNotification">Открыть окно оповещения</a>-->
<!-- Конец Модальное оповещений -->

<div class="sidebar" :class="{ active: isSidebarOpen }" ref="sidebarRef">
    <a href="#" class="css-close" title="Закрыть" @click.prevent="toggleSidebar(false)">&times;</a>

    <h2>Содержание</h2>
    <ul>
        <li v-for="val in content" :key="val.id">
            <a href="#" @click.prevent="selectChapter(val); toggleSidebar(false)">{{ val.content }}</a>
        </li>
    </ul>
</div>
<header>
    <div class="block-link">
        <a href="#" class="link-rider link-rider-content" @click.prevent="toggleSidebar(true)">

            <img src="/img/content.png">
            <div>Содержание</div>
        </a>
        <a href="../" class="link-rider">
            <div>Вернуться на сайт</div>
        </a>
        <a href="#modal-notification" class="link-rider" @click="triggerNotification">
            <div>+ Добавить в библиотеку</div>
        </a>
    </div>
    <div class="block-link">
        <div>
            <button
                    class="link-rider"
                    @click="increaseBrightness"
                    :disabled="isMaxBrightness"
            >
                <img src="/img/brightness.png">
                <div>
                    +
                </div>
            </button>
            <button
                    class="link-rider"
                    @click="reduceBrightness"
                    :disabled="isMinBrightness"
            >
                <img src="/img/brightness2.png">
                <div>
                    -
                </div>
            </button>
        </div>
        <div>
            <button
                    class="link-rider"
                    @click="increaseFont"
                    :disabled="isMaxFont"
            >
                <img src="/img/fonts.png">
            </button>
            <button
                    class="link-rider"
                    @click="reduceFont"
                    :disabled="isMinFont"
            >
                <img src="/img/fonts1.png">
            </button>
        </div>

    </div>

</header>
<main id="text" :style="currentStyle">
    <h3>{{ currentChapter.content }}</h3>
    {{ currentChapter.text }}
</main>
</body>
</html>
